<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Design Interview — Runde 7</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0a0a0c;color:#e8e8ea;font-family:system-ui,sans-serif;min-height:100vh}
#shell{max-width:960px;margin:0 auto;padding:2rem 1.5rem 6rem}
.hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:2.5rem}
.hdr-title{font-size:.85rem;font-weight:600;color:#555;letter-spacing:.08em;text-transform:uppercase}
.hdr-count{font-size:.85rem;color:#555}
.prog-wrap{height:3px;background:#1e1e22;border-radius:99px;margin-bottom:2.5rem;overflow:hidden}
.prog-fill{height:100%;background:linear-gradient(90deg,#059669,#10b981);border-radius:99px;transition:width .4s ease}
.q-label{font-size:.75rem;font-weight:600;color:#059669;text-transform:uppercase;letter-spacing:.1em;margin-bottom:.6rem}
.q-text{font-size:1.5rem;font-weight:700;line-height:1.3;margin-bottom:.5rem}
.q-sub{font-size:.9rem;color:#666;margin-bottom:2rem}
.opts{display:grid;grid-template-columns:repeat(2,1fr);gap:1rem}
.opts.cols3{grid-template-columns:repeat(3,1fr)}
@media(max-width:600px){.opts,.opts.cols3{grid-template-columns:1fr}}
.opt{border:2px solid #1e1e22;border-radius:12px;overflow:hidden;cursor:pointer;transition:border-color .15s,transform .15s;background:#0f0f12}
.opt:hover{border-color:#059669;transform:translateY(-2px)}
.opt.selected{border-color:#059669;background:#041510}
.opt-preview{width:100%;height:160px;overflow:hidden;position:relative;background:#16161a}
.opt-label{padding:.75rem 1rem;font-size:.875rem;font-weight:600}
.opt-desc{padding:0 1rem .75rem;font-size:.75rem;color:#666;line-height:1.4}
.nav{position:fixed;bottom:0;left:0;right:0;background:#0a0a0c;border-top:1px solid #1e1e22;padding:1rem 1.5rem;display:flex;justify-content:space-between;align-items:center}
.nav-info{font-size:.8rem;color:#444}
.btn{padding:.6rem 1.4rem;border-radius:8px;font-size:.875rem;font-weight:600;cursor:pointer;border:none;transition:background .15s}
.btn-primary{background:#059669;color:#fff}
.btn-primary:hover{background:#047857}
.btn-primary:disabled{background:#09261a;color:#2a5a3a;cursor:not-allowed}
.btn-ghost{background:transparent;color:#666;border:1px solid #2a2a2e}
.btn-ghost:hover{border-color:#555;color:#aaa}
.summary-wrap{display:none}
.summary-wrap.visible{display:block}
.summary-item{display:flex;gap:1rem;align-items:flex-start;padding:1rem;border:1px solid #1e1e22;border-radius:10px;margin-bottom:.75rem;background:#0f0f12}
.summary-q{font-size:.75rem;color:#666;margin-bottom:.2rem}
.summary-a{font-size:.9rem;font-weight:600}
.summary-preview{width:80px;height:50px;border-radius:6px;overflow:hidden;flex-shrink:0;position:relative}
.done-msg{text-align:center;padding:2rem 0 1.5rem}
.done-msg h2{font-size:1.6rem;font-weight:700;margin-bottom:.5rem}
.done-msg p{color:#666;margin-bottom:2rem}
.context{background:#041510;border:1px solid #083a20;border-radius:10px;padding:1rem 1.25rem;margin-bottom:2rem;font-size:.8rem;color:#34d399}
.context-row{display:flex;flex-wrap:wrap;gap:.5rem;margin-top:.5rem}
.tag{padding:2px 8px;background:#083a20;border-radius:99px;font-size:.75rem;color:#6ee7b7}
</style>
</head>
<body>
<div id="shell">
  <div class="hdr">
    <span class="hdr-title">Design Interview — Runde 7</span>
    <span class="hdr-count" id="hdr-count"></span>
  </div>
  <div class="prog-wrap"><div class="prog-fill" id="prog"></div></div>
  <div class="context">
    <strong>Fast fertig. Letzte Feinheiten:</strong>
    <div class="context-row">
      <span class="tag">Timeline: Firma+Badge+Datum</span>
      <span class="tag">Profil-Dropdown mit Stift</span>
      <span class="tag">Amber / Dunkelrot</span>
      <span class="tag">Fade-in Übergang</span>
      <span class="tag">Sidebar klappt auf bei Hover</span>
    </div>
  </div>
  <div id="question-area"></div>
  <div class="summary-wrap" id="summary"></div>
</div>
<div class="nav">
  <button class="btn btn-ghost" id="btn-back" onclick="goBack()">← Zurück</button>
  <span class="nav-info" id="nav-info"></span>
  <button class="btn btn-primary" id="btn-next" onclick="goNext()" disabled>Weiter →</button>
</div>

                <div style="display:flex;flex-direction:column;align-items:center;gap:1px;flex-shrink:0">
                  <div style="width:5px;height:5px;background:${c};border-radius:50%"></div>
                  ${i===0?'<div style="width:1px;height:12px;background:#1e1e22"></div>':''}
                </div>
                <div style="flex:1;padding:3px 5px;background:#0f0f12;border-radius:4px;border:1px solid #1a1a1e">
                  <div style="height:4px;background:#555;border-radius:2px;width:65%"></div>
                </div>
              </div>`).join('')}
            <div style="height:4px;background:#3b82f6;border-radius:2px;width:30%;margin-top:4px;margin-bottom:2px"></div>
            <div style="display:flex;gap:4px;align-items:center">
              <div style="width:5px;height:5px;background:#3b82f6;border-radius:50%;flex-shrink:0"></div>
              <div style="flex:1;padding:3px 5px;background:#0f0f12;border-radius:4px;border:1px solid #1a1a1e">
                <div style="height:4px;background:#555;border-radius:2px;width:60%"></div>
              </div>
            </div>
          </div>`
      }
    ]
  },
  {
    id: 'scroll-behavior',
    label: 'Letzte Frage — Scrollen',
    text: 'Scrollen die Input- und Ergebnis-Seite unabhängig voneinander?',
    sub: 'Der Ergebnisbereich kann sehr lang sein (Badge + Diff + Anschreiben + Chat). Wie scrollt das?',
    cols: 2,
    options: [
      {
        id: 'independent',
        label: 'Beide scrollen unabhängig',
        desc: 'Input-Panel links hat eigenen Scroll. Ergebnis-Panel rechts hat eigenen Scroll. Beide können übereinander hinausgehen.',
        preview: `
          <div style="display:flex;height:100%;background:#0a0a0c;overflow:hidden">
            <div style="width:44px;background:#080810;border-right:1px solid #1a1a20"></div>
            <div style="width:35%;background:#0a0a0c;border-right:1px solid #1a1a20;padding:6px;display:flex;flex-direction:column;gap:4px;overflow:hidden;position:relative">
              <div style="height:5px;background:#555;border-radius:2px;width:50%"></div>
              <div style="height:16px;background:#111114;border-radius:4px;border:1px solid #222"></div>
              <div style="flex:1;background:#0f0f12;border-radius:4px;border:1px solid #1a1a1e;min-height:60px"></div>
              <div style="height:14px;background:#059669;border-radius:4px"></div>
              <div style="position:absolute;right:3px;top:20%;bottom:20%;width:2px;background:#1e3a1e;border-radius:99px">
                <div style="height:30%;background:#059669;border-radius:99px;margin-top:20%"></div>
              </div>
            </div>
            <div style="flex:1;padding:6px;display:flex;flex-direction:column;gap:3px;overflow:hidden;position:relative">
              <div style="height:10px;background:#041510;border-radius:99px;width:55%;border:1px solid #083a20"></div>
              <div style="display:flex;align-items:center;gap:3px"><div style="height:2px;background:#059669;width:10px;border-radius:2px"></div><div style="height:3px;background:#059669;border-radius:2px;width:25px"></div><div style="flex:1;height:1px;background:#1e1e22"></div></div>
              <div style="height:3px;background:#0a3a2a;border-radius:2px;width:85%"></div>
              <div style="height:3px;background:#3a1a1a;border-radius:2px;width:60%;opacity:.7"></div>
              <div style="height:3px;background:#1e1e22;border-radius:2px;width:75%"></div>
              <div style="height:3px;background:#1e1e22;border-radius:2px;width:65%"></div>
              <div style="position:absolute;right:3px;top:10%;bottom:10%;width:2px;background:#1e3a1e;border-radius:99px">
                <div style="height:25%;background:#059669;border-radius:99px;margin-top:10%"></div>
              </div>
            </div>
          </div>`
      },
      {
        id: 'page-scroll',
        label: 'Eine gemeinsame Seite scrollt',
        desc: 'Die ganze Seite scrollt zusammen. Input-Panel bleibt oben fixiert (sticky), Ergebnis darunter wächst.',
        preview: `
          <div style="display:flex;height:100%;background:#0a0a0c;overflow:hidden;position:relative">
            <div style="width:44px;background:#080810;border-right:1px solid #1a1a20"></div>
            <div style="flex:1;display:flex;flex-direction:column;">
              <div style="display:flex;border-bottom:1px solid #1a1a1e;background:#0a0a0c;padding:5px;gap:4px;flex-shrink:0">
                <div style="width:35%;display:flex;flex-direction:column;gap:3px">
                  <div style="height:5px;background:#555;border-radius:2px;width:50%"></div>
                  <div style="height:14px;background:#111114;border-radius:3px;border:1px solid #222"></div>
                  <div style="height:14px;background:#059669;border-radius:3px;width:60%"></div>
                </div>
                <div style="flex:1;padding-left:4px">
                  <div style="height:5px;background:#041510;border-radius:99px;width:70%;border:1px solid #083a20;margin-bottom:3px"></div>
                  <div style="height:4px;background:#0a3a2a;border-radius:2px;width:90%"></div>
                </div>

              <div style="flex:1;padding:5px;display:flex;flex-direction:column;gap:2px">
                <div style="height:3px;background:#3a1a1a;border-radius:2px;width:70%;opacity:.7"></div>
                <div style="height:3px;background:#1e1e22;border-radius:2px;width:80%"></div>
                <div style="height:3px;background:#1e1e22;border-radius:2px;width:65%"></div>
              </div>

              <div style="height:20%;background:#059669;border-radius:99px;margin-top:5%"></div>

let current = 0;
const answers = JSON.parse(localStorage.getItem('design-answers-7') || '{}');

function render() {
  const q = questions[current];
  const isSummary = current >= questions.length;
  document.getElementById('hdr-count').textContent = isSummary ? 'Fertig!' : `${current+1} / ${questions.length}`;
  document.getElementById('prog').style.width = `${((current+(isSummary?1:0))/questions.length)*100}%`;
  document.getElementById('btn-back').style.display = (current===0||isSummary)?'none':'';
  document.getElementById('btn-next').style.display = isSummary?'none':'';
  if (isSummary) { renderSummary(); return; }
  const sel = answers[q.id];
  document.getElementById('nav-info').textContent = sel?'':'Bitte eine Option wählen';
  document.getElementById('btn-next').disabled = !sel;
  document.getElementById('summary').classList.remove('visible');
  document.getElementById('question-area').style.display = '';
  document.getElementById('question-area').innerHTML = `
    <div class="q-label">${q.label}</div>
    <div class="q-text">${q.text}</div>
    ${q.sub?`<div class="q-sub">${q.sub}</div>`:''}
    <div class="opts ${q.cols===3?'cols3':''}">
      ${q.options.map(opt=>`
        <div class="opt ${sel===opt.id?'selected':''}" onclick="selectOpt('${q.id}','${opt.id}',this)">
          <div class="opt-preview">${opt.preview}</div>
          <div class="opt-label">${opt.label}</div>
          <div class="opt-desc">${opt.desc}</div>
        </div>`).join('')}
    </div>`;
}
function selectOpt(qid,oid,el){
  answers[qid]=oid;
  localStorage.setItem('design-answers-7',JSON.stringify(answers));
  document.querySelectorAll('.opt').forEach(e=>e.classList.remove('selected'));
  el.classList.add('selected');
  document.getElementById('btn-next').disabled=false;
  document.getElementById('nav-info').textContent='';
}
function goNext(){current++;render();window.scrollTo(0,0);}
function goBack(){if(current>0){current--;render();window.scrollTo(0,0);}}
function renderSummary(){
  document.getElementById('question-area').style.display='none';
  const sumEl=document.getElementById('summary');
  sumEl.classList.add('visible');
  let rows='';
  questions.forEach(q=>{
    const aid=answers[q.id];
    const opt=q.options.find(o=>o.id===aid);
    if(!opt)return;
    rows+=`<div class="summary-item"><div class="summary-preview" style="position:relative">${opt.preview}</div><div><div class="summary-q">${q.label}</div><div class="summary-a">${opt.label}</div><div style="font-size:.75rem;color:#555;margin-top:.15rem">${opt.desc}</div></div></div>`;
  });
  sumEl.innerHTML=`<div class="done-msg"><h2>✅ Design-Interview vollständig!</h2><p>Alle Entscheidungen getroffen. Claude baut jetzt die komplette UI.</p></div>${rows}
    <button class="btn btn-primary" style="width:100%;margin-top:1rem;padding:.9rem" onclick="submit()">Absenden →</button>`;
  fetch('/api/design-answers-7',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(answers)})
    .then(r=>r.json()).then(()=>{document.querySelector('.done-msg p').textContent='✅ Gespeichert! Claude beginnt jetzt mit dem Bauen.';}).catch(()=>{});
}
function submit(){
  fetch('/api/design-answers-7',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(answers)})
    .then(r=>r.json()).then(()=>{document.querySelector('.done-msg p').textContent='✅ Gespeichert! Claude beginnt jetzt mit dem Bauen.';});
}
render();
</script>
