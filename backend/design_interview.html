<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Design Interview</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0a0a0c;color:#e8e8ea;font-family:system-ui,sans-serif;min-height:100vh}
#shell{max-width:960px;margin:0 auto;padding:2rem 1.5rem 6rem}

/* Header */
.hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:2.5rem}
.hdr-title{font-size:.85rem;font-weight:600;color:#555;letter-spacing:.08em;text-transform:uppercase}
.hdr-count{font-size:.85rem;color:#555}

/* Progress */
.prog-wrap{height:3px;background:#1e1e22;border-radius:99px;margin-bottom:2.5rem;overflow:hidden}
.prog-fill{height:100%;background:linear-gradient(90deg,#3b82f6,#8b5cf6);border-radius:99px;transition:width .4s ease}

/* Question */
.q-label{font-size:.75rem;font-weight:600;color:#3b82f6;text-transform:uppercase;letter-spacing:.1em;margin-bottom:.6rem}
.q-text{font-size:1.5rem;font-weight:700;line-height:1.3;margin-bottom:.5rem}
.q-sub{font-size:.9rem;color:#666;margin-bottom:2rem}

/* Options grid */
.opts{display:grid;grid-template-columns:repeat(2,1fr);gap:1rem}
.opts.cols3{grid-template-columns:repeat(3,1fr)}
@media(max-width:600px){.opts,.opts.cols3{grid-template-columns:1fr}}

/* Option card */
.opt{border:2px solid #1e1e22;border-radius:12px;overflow:hidden;cursor:pointer;transition:border-color .15s,transform .15s;background:#0f0f12}
.opt:hover{border-color:#3b82f6;transform:translateY(-2px)}
.opt.selected{border-color:#3b82f6;background:#0d1629}
.opt.selected .opt-preview{outline:none}
.opt-preview{width:100%;height:160px;overflow:hidden;position:relative;background:#16161a}
.opt-label{padding:.75rem 1rem;font-size:.875rem;font-weight:600}
.opt-desc{padding:0 1rem .75rem;font-size:.75rem;color:#666;line-height:1.4}

/* Nav buttons */
.nav{position:fixed;bottom:0;left:0;right:0;background:#0a0a0c;border-top:1px solid #1e1e22;padding:1rem 1.5rem;display:flex;justify-content:space-between;align-items:center}
.nav-info{font-size:.8rem;color:#444}
.btn{padding:.6rem 1.4rem;border-radius:8px;font-size:.875rem;font-weight:600;cursor:pointer;border:none;transition:background .15s}
.btn-primary{background:#3b82f6;color:#fff}
.btn-primary:hover{background:#2563eb}
.btn-primary:disabled{background:#1e3a5f;color:#4a6080;cursor:not-allowed}
.btn-ghost{background:transparent;color:#666;border:1px solid #2a2a2e}
.btn-ghost:hover{border-color:#555;color:#aaa}

/* Summary screen */
.summary-wrap{display:none}
.summary-wrap.visible{display:block}
.summary-item{display:flex;gap:1rem;align-items:flex-start;padding:1rem;border:1px solid #1e1e22;border-radius:10px;margin-bottom:.75rem;background:#0f0f12}
.summary-q{font-size:.75rem;color:#666;margin-bottom:.2rem}
.summary-a{font-size:.9rem;font-weight:600}
.summary-preview{width:80px;height:50px;border-radius:6px;overflow:hidden;flex-shrink:0}
.done-msg{text-align:center;padding:2rem 0 1.5rem}
.done-msg h2{font-size:1.6rem;font-weight:700;margin-bottom:.5rem}
.done-msg p{color:#666;margin-bottom:2rem}

/* Mini UI elements for previews */
.mini-nav{height:28px;background:#111114;display:flex;align-items:center;padding:0 10px;gap:8px;border-bottom:1px solid #222}
.mini-nav-dot{width:5px;height:5px;border-radius:50%}
.mini-tab{padding:3px 8px;border-radius:4px;font-size:9px;font-weight:600}
.mini-sidebar{width:35%;height:100%;background:#0d0d10;border-right:1px solid #1e1e22;padding:8px;display:flex;flex-direction:column;gap:5px}
.mini-main{flex:1;padding:8px;display:flex;flex-direction:column;gap:5px}
.mini-row{display:flex;height:100%}
.mini-bar{border-radius:3px;height:6px}
.mini-btn{border-radius:4px;height:18px;display:flex;align-items:center;justify-content:center;font-size:8px;font-weight:700}
.mini-input{border-radius:4px;border:1px solid #222;padding:4px 6px;background:#0a0a0c;height:40px}
.mini-card{border-radius:6px;padding:6px;background:#141418;border:1px solid #222}
.mini-score-ring{width:50px;height:50px;border-radius:50%;border:4px solid;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;margin:auto}
</style>
</head>

let current = 0;
const answers = JSON.parse(localStorage.getItem('design-answers') || '{}');

function render() {
  const q = questions[current];
  const isSummary = current >= questions.length;

  document.getElementById('hdr-count').textContent = isSummary ? 'Fertig!' : `${current+1} / ${questions.length}`;
  document.getElementById('prog').style.width = `${((current + (isSummary?1:0)) / questions.length) * 100}%`;

  document.getElementById('btn-back').style.display = (current === 0 || isSummary) ? 'none' : '';
  document.getElementById('btn-next').style.display = isSummary ? 'none' : '';

  if (isSummary) {
    renderSummary();
    return;
  }

  const sel = answers[q.id];
  document.getElementById('nav-info').textContent = sel ? '' : 'Bitte eine Option wählen';
  document.getElementById('btn-next').disabled = !sel;

  document.getElementById('summary').classList.remove('visible');
  document.getElementById('question-area').style.display = '';
  document.getElementById('question-area').innerHTML = `
    <div class="q-label">${q.label}</div>
    <div class="q-text">${q.text}</div>
    ${q.sub ? `<div class="q-sub">${q.sub}</div>` : ''}
    <div class="opts ${q.cols === 3 ? 'cols3' : ''}">
      ${q.options.map(opt => `
        <div class="opt ${sel === opt.id ? 'selected' : ''}" onclick="select('${q.id}','${opt.id}')">
          <div class="opt-preview">${opt.preview}</div>
          <div class="opt-label">${opt.label}</div>
          <div class="opt-desc">${opt.desc}</div>
        </div>
      `).join('')}
    </div>
  `;
}

function select(qid, oid) {
  answers[qid] = oid;
  localStorage.setItem('design-answers', JSON.stringify(answers));
  document.querySelectorAll('.opt').forEach(el => el.classList.remove('selected'));
  event.currentTarget.classList.add('selected');
  document.getElementById('btn-next').disabled = false;
  document.getElementById('nav-info').textContent = '';
}

function goNext() {
  current++;
  render();
  window.scrollTo(0,0);
}

function goBack() {
  if (current > 0) { current--; render(); window.scrollTo(0,0); }
}

function renderSummary() {
  document.getElementById('question-area').style.display = 'none';
  document.getElementById('nav-info').textContent = '';

  const sumEl = document.getElementById('summary');
  sumEl.classList.add('visible');

  let rows = '';
  questions.forEach(q => {
    const aid = answers[q.id];
    const opt = q.options.find(o => o.id === aid);
    if (!opt) return;
    rows += `<div class="summary-item">
      <div class="summary-preview">${opt.preview}</div>
      <div>
        <div class="summary-q">${q.label}</div>
        <div class="summary-a">${opt.label}</div>
        <div style="font-size:.75rem;color:#555;margin-top:.15rem">${opt.desc}</div>
      </div>
    </div>`;
  });

  sumEl.innerHTML = `
    <div class="done-msg">
      <h2>✅ Fertig!</h2>
      <p>Deine Auswahl wird jetzt gespeichert und ich baue die neue UI.</p>
    </div>
    ${rows}
    <button class="btn btn-primary" style="width:100%;margin-top:1rem;padding:.9rem" onclick="submit()">
      Auswahl bestätigen & absenden →
    </button>
    <button class="btn btn-ghost" style="width:100%;margin-top:.5rem" onclick="current=0;render()">
      Von vorne beginnen
    </button>
  `;

  // Auto-submit
  fetch('/api/design-answers', {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify(answers)
  }).catch(()=>{});
}

function submit() {
  fetch('/api/design-answers', {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify(answers)
  }).then(r => r.json()).then(() => {
    document.querySelector('.done-msg p').textContent = '✅ Gespeichert! Claude baut jetzt die neue UI.';
  }).catch(() => {
    document.querySelector('.done-msg p').textContent = 'Fehler beim Speichern. Bitte Screenshot machen.';
  });
}

// Restore progress
const saved = localStorage.getItem('design-progress');
if (saved) current = Math.min(parseInt(saved), questions.length);

render();
window.addEventListener('beforeunload', () => {
  localStorage.setItem('design-progress', current);
});
</script>
