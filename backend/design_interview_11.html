<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Design Interview — Runde 11 (Final)</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0a0a0c;color:#e8e8ea;font-family:system-ui,sans-serif;min-height:100vh}
#shell{max-width:960px;margin:0 auto;padding:2rem 1.5rem 6rem}
.hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:2.5rem}
.hdr-title{font-size:.85rem;font-weight:600;color:#555;letter-spacing:.08em;text-transform:uppercase}
.hdr-count{font-size:.85rem;color:#555}
.prog-wrap{height:3px;background:#1e1e22;border-radius:99px;margin-bottom:2.5rem;overflow:hidden}
.prog-fill{height:100%;background:linear-gradient(90deg,#059669,#10b981);border-radius:99px;transition:width .4s ease}
.q-label{font-size:.75rem;font-weight:600;color:#059669;text-transform:uppercase;letter-spacing:.1em;margin-bottom:.6rem}
.q-text{font-size:1.45rem;font-weight:700;line-height:1.3;margin-bottom:.5rem}
.q-sub{font-size:.9rem;color:#666;margin-bottom:2rem}
.opts{display:grid;grid-template-columns:repeat(2,1fr);gap:1rem}
.opts.cols3{grid-template-columns:repeat(3,1fr)}
@media(max-width:600px){.opts,.opts.cols3{grid-template-columns:1fr}}
.opt{border:2px solid #1e1e22;border-radius:12px;overflow:hidden;cursor:pointer;transition:border-color .15s,transform .15s;background:#0f0f12}
.opt:hover{border-color:#059669;transform:translateY(-2px)}
.opt.selected{border-color:#059669;background:#041510}
.opt-preview{width:100%;height:150px;overflow:hidden;position:relative;background:#16161a}
.opt-label{padding:.7rem 1rem;font-size:.875rem;font-weight:600}
.opt-desc{padding:0 1rem .7rem;font-size:.75rem;color:#666;line-height:1.4}
.nav{position:fixed;bottom:0;left:0;right:0;background:#0a0a0c;border-top:1px solid #1e1e22;padding:1rem 1.5rem;display:flex;justify-content:space-between;align-items:center}
.nav-info{font-size:.8rem;color:#444}
.btn{padding:.6rem 1.4rem;border-radius:8px;font-size:.875rem;font-weight:600;cursor:pointer;border:none;transition:background .15s}
.btn-primary{background:#059669;color:#fff}.btn-primary:hover{background:#047857}
.btn-primary:disabled{background:#09261a;color:#2a5a3a;cursor:not-allowed}
.btn-ghost{background:transparent;color:#666;border:1px solid #2a2a2e}.btn-ghost:hover{border-color:#555;color:#aaa}
.summary-wrap{display:none}.summary-wrap.visible{display:block}
.summary-item{display:flex;gap:1rem;align-items:flex-start;padding:1rem;border:1px solid #1e1e22;border-radius:10px;margin-bottom:.75rem;background:#0f0f12}
.summary-q{font-size:.75rem;color:#666;margin-bottom:.2rem}
.summary-a{font-size:.9rem;font-weight:600}
.summary-preview{width:80px;height:50px;border-radius:6px;overflow:hidden;flex-shrink:0}
.done-msg{text-align:center;padding:2rem 0 1.5rem}
.done-msg h2{font-size:1.6rem;font-weight:700;margin-bottom:.5rem}
.done-msg p{color:#666;margin-bottom:2rem}
.finale-badge{display:inline-block;padding:3px 10px;background:#083a20;border:1px solid #059669;border-radius:99px;font-size:.75rem;color:#6ee7b7;margin-bottom:1.5rem}
</style>
</head>
<body>
<div id="shell">
  <div class="hdr">
    <span class="hdr-title">Runde 11 — Letzte Fragen</span>
    <span class="hdr-count" id="hdr-count"></span>
  </div>
  <div class="prog-wrap"><div class="prog-fill" id="prog"></div></div>
  <div class="finale-badge">🎯 Finale Runde — danach wird gebaut</div>
  <div id="question-area"></div>
  <div class="summary-wrap" id="summary"></div>
</div>
<div class="nav">
  <button class="btn btn-ghost" id="btn-back" onclick="goBack()">← Zurück</button>
  <span class="nav-info" id="nav-info"></span>
  <button class="btn btn-primary" id="btn-next" onclick="goNext()" disabled>Weiter →</button>
</div>

<script>
const Q = [
  {
    id:'button-loading-state',label:'Frage 1 — Button während Analyse',
    text:'Wie sieht der „Analysieren"-Button aus während die Analyse läuft?',
    sub:'Die Analyse dauert 10–30 Sekunden. Der Button sollte das widerspiegeln.',
    cols:3,options:[
      {id:'spinner-disabled',label:'Spinner + deaktiviert',desc:'Button wird ausgegraut, zeigt einen kleinen Lade-Spinner links neben dem Text "Analysiere…". Klar dass man nicht nochmal klicken soll.',preview:`
        <div style="background:#0a0a0c;height:100%;display:flex;align-items:flex-end;padding:16px">
          <div style="width:100%;height:34px;background:#09261a;border-radius:7px;border:1px solid #1e4a2a;display:flex;align-items:center;justify-content:center;gap:7px">
            <div style="width:12px;height:12px;border-radius:50%;border:2px solid #1e4a2a;border-top-color:#059669"></div>
            <div style="height:4px;background:#1e4a2a;border-radius:2px;width:55px"></div>
          </div>
        </div>`},
      {id:'pulse-green',label:'Pulsierendes Grün',desc:'Button bleibt grün aber pulsiert sanft (Opacity 1→0.6→1). Kein Spinner, wirkt "lebendig".',preview:`
        <div style="background:#0a0a0c;height:100%;display:flex;align-items:flex-end;padding:16px">
          <div style="width:100%;height:34px;background:#059669;border-radius:7px;display:flex;align-items:center;justify-content:center;opacity:.65">
            <div style="height:4px;background:rgba(255,255,255,.7);border-radius:2px;width:65px"></div>
          </div>
        </div>`},
      {id:'progress-bar-button',label:'Fortschrittsbalken im Button',desc:'Der Button füllt sich von links nach rechts grün während die Schritte abgeschlossen werden.',preview:`
        <div style="background:#0a0a0c;height:100%;display:flex;align-items:flex-end;padding:16px">
          <div style="width:100%;height:34px;background:#09261a;border-radius:7px;overflow:hidden;position:relative;border:1px solid #1e4a2a">
            <div style="position:absolute;left:0;top:0;bottom:0;width:60%;background:#059669;border-radius:7px 0 0 7px"></div>
            <div style="position:relative;z-index:1;height:100%;display:flex;align-items:center;justify-content:center">
              <div style="height:4px;background:rgba(255,255,255,.8);border-radius:2px;width:55px"></div>
            </div>
          </div>
        </div>`}
    ]
  },
  {
    id:'diff-deletions',label:'Frage 2 — CV-Diff: Löschungen',
    text:'Wie werden im CV-Diff entfernte Stellen dargestellt?',
    sub:'Grüne Zeilen = hinzugefügt. Was ist mit Zeilen die gelöscht oder ersetzt wurden?',
    cols:3,options:[
      {id:'red-minus',label:'Rote Zeilen mit „−"',desc:'Entfernte Zeilen erscheinen in Rot mit einem „−" Zeichen vorne. Git-Stil, vollständig.',preview:`
        <div style="background:#0a0a0c;height:100%;padding:10px;display:flex;flex-direction:column;gap:2px;justify-content:center;font-family:monospace">
          ${[['−','#3a1a1a','#b91c1c','90%'],['−','#3a1a1a','#b91c1c','70%'],['+','#0a3a2a','#059669','85%'],['+','#0a3a2a','#059669','60%'],['','#111','#333','75%'],['','#111','#333','55%']].map(([s,bg,c,w])=>`
            <div style="display:flex;align-items:center;gap:4px;background:${bg};border-radius:2px;padding:1px 4px">
              <div style="width:8px;font-size:7px;color:${c};flex-shrink:0">${s}</div>
              <div style="height:3px;background:${c};border-radius:2px;width:${w};opacity:.6"></div>
            </div>`).join('')}
        </div>`},
      {id:'strikethrough',label:'Durchgestrichen grau',desc:'Gelöschte Zeilen erscheinen grau und durchgestrichen — wie "ausgegraut". Keine rote Farbe.',preview:`
        <div style="background:#0a0a0c;height:100%;padding:10px;display:flex;flex-direction:column;gap:2px;justify-content:center">
          ${[[true,'85%'],[true,'65%'],[false,'90%',true],[false,'70%',true],[false,'75%',false],[false,'50%',false]].map(([del,w,add])=>`
            <div style="display:flex;align-items:center;gap:4px;background:${add?'#0a3a2a':del?'transparent':'transparent'};border-radius:2px;padding:1px 4px">
              ${add?`<div style="width:8px;font-size:7px;color:#059669;flex-shrink:0">+</div>`:`<div style="width:8px;flex-shrink:0"></div>`}
              <div style="height:3px;background:${add?'#059669':del?'#2a2a2e':'#1a1a1e'};border-radius:2px;width:${w};${del?'opacity:.4;text-decoration:line-through':''}"></div>
              ${del?`<div style="position:absolute;height:1px;background:#2a2a2e;width:${w}"></div>`:''}
            </div>`).join('')}
        </div>`},
      {id:'additions-only',label:'Nur Hinzufügungen',desc:'Nur grüne „+" Zeilen werden gezeigt. Keine Löschungen angezeigt — übersichtlicher, weniger Information.',preview:`
        <div style="background:#0a0a0c;height:100%;padding:10px;display:flex;flex-direction:column;gap:2px;justify-content:center">
          ${[[true,'#0a3a2a','#059669','85%'],[true,'#0a3a2a','#059669','65%'],[false,'transparent','#1a1a1e','80%'],[false,'transparent','#1a1a1e','55%'],[false,'transparent','#1a1a1e','70%']].map(([add,bg,c,w])=>`
            <div style="display:flex;align-items:center;gap:4px;background:${bg};border-radius:2px;padding:1px 4px">
              <div style="width:8px;font-size:7px;color:${add?'#059669':'transparent'};flex-shrink:0">+</div>
              <div style="height:3px;background:${c};border-radius:2px;width:${w};opacity:${add?'.7':'.3'}"></div>
            </div>`).join('')}
        </div>`}
    ]
  },
  {
    id:'bewertung-commentary',label:'Frage 3 — Bewertung: Erklärender Text',
    text:'Gibt es unter dem Score-Badge und den Balken einen erklärenden Text?',
    sub:'Die KI analysiert — soll sie auch in Worten erklären warum der Score so ist?',
    cols:3,options:[
      {id:'no-text',label:'Nein — nur Badge + Balken',desc:'Keine Texterklärung. Der Score spricht für sich. Kompakter Bewertungs-Block.',preview:`
        <div style="background:#0a0a0c;height:100%;padding:10px;display:flex;flex-direction:column;gap:5px">
          <div style="display:flex;align-items:center;gap:5px;margin-bottom:3px">
            <div style="width:9px;height:9px;background:#1a2a1a;border-radius:2px;border:1px solid #059669;flex-shrink:0"></div>
            <div style="height:4px;background:#059669;border-radius:2px;width:40%;opacity:.7"></div>
            <div style="height:14px;padding:0 6px;background:#041510;border:1px solid #059669;border-radius:99px;display:flex;align-items:center;margin-left:4px">
              <div style="height:3px;background:#059669;border-radius:2px;width:30px"></div>
            </div>
            <div style="flex:1;height:1px;background:#083a20"></div>
          </div>
          ${Array(5).fill(0).map((_,i)=>`
            <div style="display:flex;align-items:center;gap:4px">
              <div style="width:45px;height:3px;background:#2a2a2e;border-radius:2px;flex-shrink:0"></div>
              <div style="flex:1;height:5px;background:#1e1e22;border-radius:99px;overflow:hidden">
                <div style="height:100%;background:${['#059669','#059669','#f59e0b','#f59e0b','#b91c1c'][i]};width:${[88,75,62,55,30][i]}%;border-radius:99px"></div>
              </div>
            </div>`).join('')}
        </div>`},
      {id:'short-paragraph',label:'Kurzer Absatz',desc:'2–3 Sätze KI-Kommentar unter den Balken: "Deine technischen Skills passen gut, jedoch fehlt Erfahrung in X."',preview:`
        <div style="background:#0a0a0c;height:100%;padding:10px;display:flex;flex-direction:column;gap-4px">
          <div style="display:flex;align-items:center;gap:5px;margin-bottom:4px">
            <div style="width:9px;height:9px;background:#1a2a1a;border-radius:2px;border:1px solid #059669;flex-shrink:0"></div>
            <div style="height:4px;background:#059669;border-radius:2px;width:40%;opacity:.7"></div>
            <div style="height:12px;padding:0 5px;background:#041510;border:1px solid #059669;border-radius:99px;display:flex;align-items:center;margin-left:4px">
              <div style="height:3px;background:#059669;border-radius:2px;width:25px"></div>
            </div>
            <div style="flex:1;height:1px;background:#083a20"></div>
          </div>
          ${Array(3).fill(0).map((_,i)=>`
            <div style="display:flex;align-items:center;gap:3px;margin-bottom:2px">
              <div style="width:38px;height:3px;background:#2a2a2e;border-radius:2px;flex-shrink:0"></div>
              <div style="flex:1;height:4px;background:#1e1e22;border-radius:99px;overflow:hidden">
                <div style="height:100%;background:${['#059669','#059669','#f59e0b'][i]};width:${[85,72,58][i]}%;border-radius:99px"></div>
              </div>
            </div>`).join('')}
          <div style="margin-top:5px;background:#0f0f12;border-radius:5px;border:1px solid #1a1a1e;padding:5px;display:flex;flex-direction:column;gap:2px">
            ${[95,80,65].map(w=>`<div style="height:3px;background:#1e3a1e;border-radius:2px;width:${w}%"></div>`).join('')}
          </div>
        </div>`},
      {id:'expandable-per-dimension',label:'Aufklappbar pro Dimension',desc:'Jeder Balken hat ein ▶ Icon — klicken öffnet eine Zeile mit KI-Erklärung für genau diese Dimension.',preview:`
        <div style="background:#0a0a0c;height:100%;padding:10px;display:flex;flex-direction:column;gap:4px;justify-content:center">
          ${[['#059669',85,true],['#059669',72,false],['#f59e0b',58,false]].map(([c,p,open])=>`
            <div>
              <div style="display:flex;align-items:center;gap:3px">
                <div style="width:38px;height:3px;background:#2a2a2e;border-radius:2px;flex-shrink:0"></div>
                <div style="flex:1;height:4px;background:#1e1e22;border-radius:99px;overflow:hidden">
                  <div style="height:100%;background:${c};width:${p}%;border-radius:99px"></div>
                </div>
                <div style="font-size:8px;color:#555;flex-shrink:0">${open?'▼':'▶'}</div>
              </div>
              ${open?`<div style="margin-top:3px;margin-left:41px;background:#0a1a0f;border-radius:4px;padding:4px;border-left:2px solid ${c}">
                <div style="height:3px;background:#1e3a1e;border-radius:2px;width:90%;margin-bottom:2px"></div>
                <div style="height:3px;background:#1e3a1e;border-radius:2px;width:70%"></div>
              </div>`:''}
            </div>`).join('')}
        </div>`}
    ]
  },
  {
    id:'profile-create-location',label:'Frage 4 — Neues Profil erstellen',
    text:'Wo erscheint das Formular wenn du „+ Neues Profil" klickst?',
    sub:'Im Profil-Menü (Klick auf Avatar unten in Sidebar) gibt es einen „Neues Profil" Eintrag.',
    cols:3,options:[
      {id:'modal',label:'Modal-Dialog',desc:'Ein zentriertes Modal über dem gesamten UI. Backdrop-Overlay dahinter. Klassisch.',preview:`
        <div style="position:relative;background:#0a0a0c;height:100%;overflow:hidden">
          <div style="position:absolute;inset:0;background:rgba(0,0,0,.6)"></div>
          <div style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:130px;background:#111114;border-radius:9px;border:1px solid #1e3a1e;padding:10px;display:flex;flex-direction:column;gap:5px">
            <div style="height:5px;background:#e8e8ea;border-radius:2px;width:60%;margin-bottom:2px"></div>
            <div style="height:3px;background:#333;border-radius:2px;width:35%"></div>
            <div style="height:16px;background:#0a0a0c;border-radius:4px;border:1px solid #1e3a1e"></div>
            <div style="height:3px;background:#333;border-radius:2px;width:30%"></div>
            <div style="height:16px;background:#0a0a0c;border-radius:4px;border:1px solid #1e3a1e"></div>
            <div style="display:flex;gap:3px;margin-top:2px">
              <div style="flex:1;height:16px;background:#1a1a1e;border-radius:4px;border:1px solid #222"></div>
              <div style="flex:1;height:16px;background:#059669;border-radius:4px"></div>
            </div>
          </div>
        </div>`},
      {id:'sidebar-expand',label:'Inline im Sidebar-Menü',desc:'Das Profil-Menü klappt sich aus und zeigt das Formular direkt inline. Kein separater Dialog.',preview:`
        <div style="position:relative;background:#0a0a0c;height:100%;overflow:hidden">
          <div style="position:absolute;bottom:8px;left:8px;background:#111114;border:1px solid #1e3a1e;border-radius:8px;width:130px;overflow:hidden">
            <div style="padding:5px 8px;border-bottom:1px solid #1a1a1e">
              <div style="height:4px;background:#555;border-radius:2px;width:70%;margin-bottom:2px"></div>
              <div style="height:3px;background:#2a2a2e;border-radius:2px;width:50%"></div>
            </div>
            <div style="padding:7px 8px;display:flex;flex-direction:column;gap:4px">
              <div style="height:3px;background:#555;border-radius:2px;width:25%"></div>
              <div style="height:14px;background:#0a0a0c;border-radius:3px;border:1px solid #1e3a1e"></div>
              <div style="height:3px;background:#555;border-radius:2px;width:30%"></div>
              <div style="height:14px;background:#0a0a0c;border-radius:3px;border:1px solid #1e3a1e"></div>
              <div style="height:16px;background:#059669;border-radius:4px;margin-top:2px"></div>
            </div>
          </div>
        </div>`},
      {id:'right-panel-takeover',label:'Rechtes Panel',desc:'Das Ergebnis-Panel wird vorübergehend durch das "Neues Profil" Formular ersetzt. Viel Platz.',preview:`
        <div style="display:flex;height:100%;background:#0a0a0c;overflow:hidden">
          <div style="width:36px;background:#080810;border-right:1px solid #1a1a20"></div>
          <div style="width:34%;background:#0a0a0c;border-right:1px solid #1a1a20;padding:6px;display:flex;flex-direction:column;gap:4px;opacity:.3">
            <div style="flex:1;background:#111114;border-radius:5px;border:1px solid #1a1a1e;min-height:0"></div>
            <div style="height:18px;background:#2a2a2e;border-radius:5px"></div>
          </div>
          <div style="flex:1;padding:10px;display:flex;flex-direction:column;gap:5px">
            <div style="height:6px;background:#e8e8ea;border-radius:2px;width:40%;margin-bottom:4px"></div>
            <div style="height:3px;background:#333;border-radius:2px;width:25%"></div>
            <div style="height:22px;background:#111114;border-radius:5px;border:1px solid #1e3a1e"></div>
            <div style="height:3px;background:#333;border-radius:2px;width:30%"></div>
            <div style="height:22px;background:#111114;border-radius:5px;border:1px solid #1e3a1e"></div>
            <div style="display:flex;gap:4px;margin-top:2px">
              ${['#059669','#3b82f6','#a855f7','#f59e0b'].map(c=>`<div style="width:16px;height:16px;background:${c};border-radius:50%;opacity:.7"></div>`).join('')}
            </div>
            <div style="height:24px;background:#059669;border-radius:6px;margin-top:4px;width:40%"></div>
          </div>
        </div>`}
    ]
  },
  {
    id:'chat-streaming',label:'Frage 5 — Chat: KI-Antwort Streaming',
    text:'Erscheint die KI-Antwort im Chat sofort komplett oder wird sie live gestreamt?',
    sub:'Die KI-Antwort wird von der API Token für Token geliefert.',
    cols:3,options:[
      {id:'streaming-typewriter',label:'Live Streaming',desc:'Text erscheint Wort für Wort in Echtzeit. Du siehst die Antwort entstehen — lebendiger, aber komplexer.',preview:`
        <div style="position:relative;background:#0a0a0c;height:100%;overflow:hidden">
          <div style="position:absolute;bottom:0;right:0;width:145px;height:130px;background:#111114;border-radius:8px 0 0 0;border:1px solid #1e3a1e;border-right:none;border-bottom:none;padding:8px;display:flex;flex-direction:column;gap:5px">
            <div style="height:4px;background:#059669;border-radius:2px;width:60%;margin-bottom:2px"></div>
            <div style="display:flex;gap:4px;align-items:flex-start">
              <div style="width:12px;height:12px;background:#059669;border-radius:50%;flex-shrink:0"></div>
              <div style="flex:1;background:#041510;border:1px solid #083a20;border-radius:2px 6px 6px 6px;padding:4px 5px;display:flex;flex-direction:column;gap:2px">
                <div style="height:3px;background:#059669;border-radius:2px;width:90%;opacity:.7"></div>
                <div style="height:3px;background:#059669;border-radius:2px;width:70%;opacity:.7"></div>
                <div style="display:flex;align-items:center;gap:2px">
                  <div style="height:3px;background:#059669;border-radius:2px;width:40%;opacity:.7"></div>
                  <div style="width:2px;height:9px;background:#059669;opacity:.9"></div>
                </div>
              </div>
            </div>
            <div style="flex:1"></div>
            <div style="height:14px;background:#0a0a0c;border-radius:4px;border:1px solid #1e3a1e"></div>
          </div>
        </div>`},
      {id:'loading-then-full',label:'Ladeanimation → Komplett',desc:'Erst ein pulsierender "…" Bubble, dann erscheint die ganze Antwort auf einmal. Einfacher zu implementieren.',preview:`
        <div style="position:relative;background:#0a0a0c;height:100%;overflow:hidden">
          <div style="position:absolute;bottom:0;right:0;width:145px;height:130px;background:#111114;border-radius:8px 0 0 0;border:1px solid #1e3a1e;border-right:none;border-bottom:none;padding:8px;display:flex;flex-direction:column;gap:5px">
            <div style="height:4px;background:#059669;border-radius:2px;width:60%;margin-bottom:2px"></div>
            <div style="display:flex;gap:4px;align-items:flex-start">

let current = 0;
const answers = JSON.parse(localStorage.getItem('design-answers-11') || '{}');

function render() {
  const q = Q[current];
  const isSummary = current >= Q.length;
  document.getElementById('hdr-count').textContent = isSummary ? 'Fertig!' : `${current+1} / ${Q.length}`;
  document.getElementById('prog').style.width = `${((current+(isSummary?1:0))/Q.length)*100}%`;
  document.getElementById('btn-back').style.display = (current===0||isSummary)?'none':'';
  document.getElementById('btn-next').style.display = isSummary?'none':'';
  if (isSummary) { renderSummary(); return; }
  const sel = answers[q.id];
  document.getElementById('nav-info').textContent = sel?'':'Bitte eine Option wählen';
  document.getElementById('btn-next').disabled = !sel;
  document.getElementById('summary').classList.remove('visible');
  document.getElementById('question-area').style.display = '';
  document.getElementById('question-area').innerHTML = `
    <div class="q-label">${q.label}</div>
    <div class="q-text">${q.text}</div>
    ${q.sub?`<div class="q-sub">${q.sub}</div>`:''}
    <div class="opts ${q.cols===3?'cols3':''}">
      ${q.options.map(opt=>`
        <div class="opt ${sel===opt.id?'selected':''}" onclick="selectOpt('${q.id}','${opt.id}',this)">
          <div class="opt-preview">${opt.preview}</div>
          <div class="opt-label">${opt.label}</div>
          <div class="opt-desc">${opt.desc}</div>
        </div>`).join('')}
    </div>`;
}
function selectOpt(qid,oid,el){
  answers[qid]=oid;
  localStorage.setItem('design-answers-11',JSON.stringify(answers));
  document.querySelectorAll('.opt').forEach(e=>e.classList.remove('selected'));
  el.classList.add('selected');
  document.getElementById('btn-next').disabled=false;
  document.getElementById('nav-info').textContent='';
}
function goNext(){current++;render();window.scrollTo(0,0);}
function goBack(){if(current>0){current--;render();window.scrollTo(0,0);}}
function renderSummary(){
  document.getElementById('question-area').style.display='none';
  const sumEl=document.getElementById('summary');
  sumEl.classList.add('visible');
  let rows='';
  Q.forEach(q=>{
    const aid=answers[q.id];
    const opt=q.options.find(o=>o.id===aid);
    if(!opt)return;
    rows+=`<div class="summary-item"><div class="summary-preview">${opt.preview}</div><div><div class="summary-q">${q.label}</div><div class="summary-a">${opt.label}</div><div style="font-size:.75rem;color:#555;margin-top:.15rem">${opt.desc}</div></div></div>`;
  });
  sumEl.innerHTML=`<div class="done-msg"><h2>🎉 Design-Interview abgeschlossen!</h2><p>Alle Entscheidungen über alle Runden gespeichert. Claude baut jetzt die komplette React-UI.</p></div>${rows}
    <button class="btn btn-primary" style="width:100%;margin-top:1rem;padding:.9rem" onclick="submit()">Absenden & Bauen →</button>`;
  fetch('/api/design-answers-11',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(answers)})
    .then(r=>r.json()).then(()=>{}).catch(()=>{});
}
function submit(){
  fetch('/api/design-answers-11',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(answers)})
    .then(r=>r.json()).then(()=>{document.querySelector('.done-msg p').textContent='✅ Gespeichert! Das Design-Interview ist vollständig. Jetzt geht\'s ans Bauen.';});
}
render();
</script>
</body>
</html>
