<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Design Interview — Runde 8</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0a0a0c;color:#e8e8ea;font-family:system-ui,sans-serif;min-height:100vh}
#shell{max-width:960px;margin:0 auto;padding:2rem 1.5rem 6rem}
.hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:2.5rem}
.hdr-title{font-size:.85rem;font-weight:600;color:#555;letter-spacing:.08em;text-transform:uppercase}
.hdr-count{font-size:.85rem;color:#555}
.prog-wrap{height:3px;background:#1e1e22;border-radius:99px;margin-bottom:2.5rem;overflow:hidden}
.prog-fill{height:100%;background:linear-gradient(90deg,#059669,#10b981);border-radius:99px;transition:width .4s ease}
.q-label{font-size:.75rem;font-weight:600;color:#059669;text-transform:uppercase;letter-spacing:.1em;margin-bottom:.6rem}
.q-text{font-size:1.5rem;font-weight:700;line-height:1.3;margin-bottom:.5rem}
.q-sub{font-size:.9rem;color:#666;margin-bottom:2rem}
.opts{display:grid;grid-template-columns:repeat(2,1fr);gap:1rem}
.opts.cols3{grid-template-columns:repeat(3,1fr)}
@media(max-width:600px){.opts,.opts.cols3{grid-template-columns:1fr}}
.opt{border:2px solid #1e1e22;border-radius:12px;overflow:hidden;cursor:pointer;transition:border-color .15s,transform .15s;background:#0f0f12}
.opt:hover{border-color:#059669;transform:translateY(-2px)}
.opt.selected{border-color:#059669;background:#041510}
.opt-preview{width:100%;height:160px;overflow:hidden;position:relative;background:#16161a}
.opt-label{padding:.75rem 1rem;font-size:.875rem;font-weight:600}
.opt-desc{padding:0 1rem .75rem;font-size:.75rem;color:#666;line-height:1.4}
.nav{position:fixed;bottom:0;left:0;right:0;background:#0a0a0c;border-top:1px solid #1e1e22;padding:1rem 1.5rem;display:flex;justify-content:space-between;align-items:center}
.nav-info{font-size:.8rem;color:#444}
.btn{padding:.6rem 1.4rem;border-radius:8px;font-size:.875rem;font-weight:600;cursor:pointer;border:none;transition:background .15s}
.btn-primary{background:#059669;color:#fff}
.btn-primary:hover{background:#047857}
.btn-primary:disabled{background:#09261a;color:#2a5a3a;cursor:not-allowed}
.btn-ghost{background:transparent;color:#666;border:1px solid #2a2a2e}
.btn-ghost:hover{border-color:#555;color:#aaa}
.summary-wrap{display:none}
.summary-wrap.visible{display:block}
.summary-item{display:flex;gap:1rem;align-items:flex-start;padding:1rem;border:1px solid #1e1e22;border-radius:10px;margin-bottom:.75rem;background:#0f0f12}
.summary-q{font-size:.75rem;color:#666;margin-bottom:.2rem}
.summary-a{font-size:.9rem;font-weight:600}
.summary-preview{width:80px;height:50px;border-radius:6px;overflow:hidden;flex-shrink:0;position:relative}
.done-msg{text-align:center;padding:2rem 0 1.5rem}
.done-msg h2{font-size:1.6rem;font-weight:700;margin-bottom:.5rem}
.done-msg p{color:#666;margin-bottom:2rem}
.context{background:#041510;border:1px solid #083a20;border-radius:10px;padding:1rem 1.25rem;margin-bottom:2rem;font-size:.8rem;color:#34d399}
.context-row{display:flex;flex-wrap:wrap;gap:.5rem;margin-top:.5rem}
.tag{padding:2px 8px;background:#083a20;border-radius:99px;font-size:.75rem;color:#6ee7b7}
</style>
</head>
<body>
<div id="shell">
  <div class="hdr">
    <span class="hdr-title">Design Interview — Runde 8</span>
    <span class="hdr-count" id="hdr-count"></span>
  </div>
  <div class="prog-wrap"><div class="prog-fill" id="prog"></div></div>
  <div class="context">
    <strong>Implementierungsdetails — diese Antworten gehen direkt in den React-Code.</strong>
    <div class="context-row">
      <span class="tag">Balken: Farbe nach Score</span>
      <span class="tag">Chat: KI-Begrüßung</span>
      <span class="tag">Icons: Duotone</span>
      <span class="tag">Sidebar: Hover-Expand</span>
      <span class="tag">Scroll: unabhängig</span>
    </div>
  </div>
  <div id="question-area"></div>
  <div class="summary-wrap" id="summary"></div>
</div>
<div class="nav">
  <button class="btn btn-ghost" id="btn-back" onclick="goBack()">← Zurück</button>
  <span class="nav-info" id="nav-info"></span>
  <button class="btn btn-primary" id="btn-next" onclick="goNext()" disabled>Weiter →</button>
</div>

<script>
const questions = [
  {
    id: 'sidebar-expand-mode',

    cols: 3,
    options: [
      {
        id: 'push',
        label: 'Schiebt den Inhalt',
        desc: 'Die Sidebar wird breiter, der Hauptinhalt rückt nach rechts. Layout-Shift, aber kein Overlay.',

          <div style="display:flex;height:100%;background:#0a0a0c;transition:all .3s">

              <div style="width:20px;height:20px;background:#1a2a1a;border-radius:4px;border:1px solid #059669;position:relative">
                <div style="position:absolute;inset:4px;background:#059669;border-radius:2px;opacity:.4"></div>
              </div>
              <div style="width:20px;height:20px;background:#111;border-radius:4px;border:1px solid #222"></div>
            </div>
            <div style="width:90px;background:#0b0b10;border-right:1px solid #1a1a20;display:flex;flex-direction:column;gap:10px;padding:10px 6px;flex-shrink:0">
              <div style="display:flex;align-items:center;gap:5px">
                <div style="width:16px;height:16px;background:#1a2a1a;border-radius:3px;border:1px solid #059669;flex-shrink:0"></div>
                <div style="height:4px;background:#059669;border-radius:2px;flex:1;opacity:.7"></div>
              </div>
              <div style="display:flex;align-items:center;gap:5px">
                <div style="width:16px;height:16px;background:#111;border-radius:3px;border:1px solid #222;flex-shrink:0"></div>
                <div style="height:4px;background:#333;border-radius:2px;flex:1"></div>
              </div>
            </div>
            <div style="flex:1;padding:6px;display:flex;flex-direction:column;gap:3px">
              <div style="height:5px;background:#444;border-radius:2px;width:60%"></div>
              <div style="height:30px;background:#111114;border-radius:4px;border:1px solid #1a1a1e;flex:1"></div>

      {
        id: 'overlay',
        label: 'Legt sich drüber',
        desc: 'Der Inhalt bleibt wo er ist. Die Sidebar klappt auf und überdeckt einen Teil. Kein Layout-Shift.',

          <div style="display:flex;height:100%;background:#0a0a0c;position:relative;overflow:hidden">

              <div style="display:flex;align-items:center;gap:5px">
                <div style="width:16px;height:16px;background:#1a2a1a;border-radius:3px;border:1px solid #059669;flex-shrink:0"></div>
                <div style="height:4px;background:#059669;border-radius:2px;flex:1;opacity:.7"></div>
              </div>

                <div style="height:4px;background:#333;border-radius:2px;flex:1"></div>
              </div>
            </div>
            <div style="flex:1;padding:6px;display:flex;flex-direction:column;gap:3px;margin-left:0">

              <div style="height:30px;background:#111114;border-radius:4px;border:1px solid #1a1a1e;flex:1"></div>

            </div>

          <div style="display:flex;height:100%;background:#0a0a0c">
            <div style="width:110px;background:#080810;border-right:1px solid #1a1a20;display:flex;flex-direction:column;gap:10px;padding:10px 8px;flex-shrink:0">

                <div style="width:16px;height:16px;background:#1a2a1a;border-radius:3px;border:1px solid #059669;flex-shrink:0"></div>

              <div style="display:flex;align-items:center;gap:6px">

              </div>

            <div style="flex:1;padding:6px;display:flex;flex-direction:column;gap:3px">
              <div style="height:5px;background:#444;border-radius:2px;width:60%"></div>
              <div style="height:30px;background:#111114;border-radius:4px;border:1px solid #1a1a1e;flex:1"></div>
              <div style="height:12px;background:#059669;border-radius:4px;width:50%"></div>

  {
    id: 'loading-step-style',
    label: 'Frage 2 — Lade-Schritt Stil',
    text: 'Wie sehen die Schritte während der Analyse aus?',
    sub: 'Schritte erscheinen nacheinander: "Stelle analysiert" → "CV verglichen" → "Anschreiben erstellt"',
    cols: 3,
    options: [
      {
        id: 'numbered-spinner',

        desc: 'Nummerierte Schritte. Aktiver Schritt hat einen rotierenden Spinner. Erledigte Schritte zeigen grüne Zahl.',

                  ${done?`<span style="font-size:9px;color:#fff;font-weight:700">${n}</span>`:active?`<div style="width:8px;height:8px;border-radius:50%;border:2px solid #059669;border-top-color:transparent"></div>`:`<span style="font-size:9px;color:#333;font-weight:700">${n}</span>`}

                <div style="height:4px;border-radius:2px;flex:1;background:${done?'#059669':active?'#1e3a1e':'#1a1a1e'}"></div>
              </div>`).join('')}
          </div>`
      },
      {
        id: 'checkmarks',
        label: 'Kreis → Haken',
        desc: 'Offener Kreis → pulsierender Kreis (aktiv) → grüner Haken (erledigt). Schlicht und klar.',
        preview: `
          <div style="background:#0a0a0c;height:100%;padding:14px;display:flex;flex-direction:column;gap:8px;justify-content:center">
            ${[['Stelle analysiert',true,false],['CV verglichen',false,true],['Anschreiben erstellt',false,false]].map(([l,done,active])=>`
              <div style="display:flex;align-items:center;gap:8px">
                <div style="width:18px;height:18px;border-radius:50%;background:${done?'#059669':'transparent'};border:2px solid ${done?'#059669':active?'#059669':'#2a2a2e'};display:flex;align-items:center;justify-content:center;flex-shrink:0;${active?'box-shadow:0 0 0 3px rgba(5,150,105,.2)':''}">
                  ${done?`<svg width="10" height="8" viewBox="0 0 10 8" fill="none"><path d="M1 4l3 3L9 1" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>`:''}

                <div style="height:4px;border-radius:2px;flex:1;background:${done?'#059669':active?'#1e3a1e':'#1a1a1e'}"></div>
              </div>`).join('')}
          </div>`
      },
      {
        id: 'progress-bar-steps',
        label: 'Balken-Schritte',
        desc: 'Jeder Schritt ist ein horizontaler Balken der sich von links nach rechts füllt. Einer nach dem anderen.',
        preview: `
          <div style="background:#0a0a0c;height:100%;padding:14px;display:flex;flex-direction:column;gap:10px;justify-content:center">
            ${[['Stelle analysiert',100],['CV verglichen',55],['Anschreiben erstellt',0]].map(([l,p])=>`
              <div>
                <div style="display:flex;justify-content:space-between;margin-bottom:3px">
                  <div style="height:4px;background:${p>0?'#059669':'#333'};border-radius:2px;width:60%"></div>

                </div>
                <div style="height:5px;background:#1a1a1e;border-radius:99px;overflow:hidden">
                  <div style="height:100%;background:#059669;width:${p}%;border-radius:99px;transition:width 1s ease"></div>
                </div>
              </div>`).join('')}
          </div>`
      }
    ]
  },
  {
    id: 'dimension-score-number',
    label: 'Frage 3 — Dimensionswert sichtbar?',
    text: 'Zeigen die Dimensions-Balken einen Prozentwert?',
    sub: 'Die 5 Balken zeigen Technisch, Anforderungen, Rollenfit usw. Die Balkenfarbe ändert sich schon nach Score.',
    cols: 3,
    options: [
      {
        id: 'bar-only',
        label: 'Nur Balken',
        desc: 'Kein Prozentwert. Die Balkenlänge und -farbe sagen alles. Ruhiger, weniger Zahlen.',
        preview: `
          <div style="background:#0a0a0c;height:100%;padding:12px;display:flex;flex-direction:column;gap:6px;justify-content:center">
            ${[['Technisch',92,'#059669'],['Anforderungen',85,'#059669'],['Rollenfit',61,'#f59e0b'],['Standort',48,'#f59e0b'],['Strategisch',28,'#b91c1c']].map(([l,p,c])=>`
              <div style="display:flex;align-items:center;gap:6px">
                <div style="width:58px;font-size:7px;color:#555;text-align:right;flex-shrink:0">${l}</div>
                <div style="flex:1;height:6px;background:#1e1e22;border-radius:99px;overflow:hidden">
                  <div style="height:100%;background:${c};width:${p}%;border-radius:99px"></div>
                </div>
              </div>`).join('')}
          </div>`
      },
      {
        id: 'bar-and-number',
        label: 'Balken + Zahl',
        desc: 'Rechts neben dem Balken steht der genaue Wert (z.B. 92%). Präzise für Detail-Nerds.',
        preview: `
          <div style="background:#0a0a0c;height:100%;padding:12px;display:flex;flex-direction:column;gap:6px;justify-content:center">
            ${[['Technisch',92,'#059669'],['Anforderungen',85,'#059669'],['Rollenfit',61,'#f59e0b'],['Standort',48,'#f59e0b'],['Strategisch',28,'#b91c1c']].map(([l,p,c])=>`
              <div style="display:flex;align-items:center;gap:6px">
                <div style="width:52px;font-size:7px;color:#555;text-align:right;flex-shrink:0">${l}</div>
                <div style="flex:1;height:6px;background:#1e1e22;border-radius:99px;overflow:hidden">
                  <div style="height:100%;background:${c};width:${p}%;border-radius:99px"></div>
                </div>
                <div style="width:22px;font-size:7px;color:${c};font-weight:700;flex-shrink:0">${p}%</div>
              </div>`).join('')}
          </div>`
      },
      {
        id: 'bar-hover-number',
        label: 'Zahl bei Hover',
        desc: 'Standardmäßig nur Balken. Wenn du mit der Maus drüber fährst, erscheint ein Tooltip mit dem Wert.',
        preview: `
          <div style="background:#0a0a0c;height:100%;padding:12px;display:flex;flex-direction:column;gap:6px;justify-content:center">

      },
      {
        id: 'bold-uppercase-icon',
        label: 'Fett + Großbuchstaben + Icon',
        desc: 'Uppercased Label in Grün, kleines Icon links, breite Divider-Linie. Klare visuelle Trennung.',
        preview: `

    sub: 'Das Anschreiben erscheint in einem Textbereich. Der Copy-Button und der Download-Button (↓) sind immer da.',
    cols: 2,
    options: [

                    <div style="height:3px;background:${c};border-radius:2px;width:16px"></div>
                  </div>
                  <div style="height:3px;background:#333;border-radius:2px;width:18px"></div>
                </div>
              </div>`).join('')}
          </div>`
      },
      {
        id: 'color-dot-only',
        label: 'Nur Farbpunkt',
        desc: 'Kein Badge. Der farbige Punkt auf der Timeline-Linie ist der Score-Indikator. Maximal kompakt.',
        preview: `
          <div style="background:#0a0a0c;height:100%;padding:10px;display:flex;flex-direction:column;gap:5px;justify-content:center">
            ${[['#059669','12. Jun'],['#f59e0b','8. Jun'],['#b91c1c','3. Jun']].map(([c,d],i)=>`
              <div style="display:flex;gap:5px;align-items:center">
                <div style="display:flex;flex-direction:column;align-items:center;gap:1px;flex-shrink:0">
                  <div style="width:9px;height:9px;background:${c};border-radius:50%;border:2px solid ${c}88"></div>
                  ${i<2?'<div style="width:1px;height:12px;background:#1e1e22"></div>':''}
                </div>
                <div style="flex:1;padding:4px 6px;background:#0f0f12;border-radius:5px;border:1px solid #1a1a1e;display:flex;align-items:center;justify-content:space-between;gap:4px">
                  <div style="height:4px;background:#555;border-radius:2px;flex:1"></div>
                  <div style="height:3px;background:#333;border-radius:2px;width:20px"></div>
                </div>
              </div>`).join('')}
          </div>`
      }
    ]
  }
];

let current = 0;
const answers = JSON.parse(localStorage.getItem('design-answers-8') || '{}');

function render() {
  const q = questions[current];
  const isSummary = current >= questions.length;
  document.getElementById('hdr-count').textContent = isSummary ? 'Fertig!' : `${current+1} / ${questions.length}`;
  document.getElementById('prog').style.width = `${((current+(isSummary?1:0))/questions.length)*100}%`;
  document.getElementById('btn-back').style.display = (current===0||isSummary)?'none':'';
  document.getElementById('btn-next').style.display = isSummary?'none':'';
  if (isSummary) { renderSummary(); return; }
  const sel = answers[q.id];
  document.getElementById('nav-info').textContent = sel?'':'Bitte eine Option wählen';
  document.getElementById('btn-next').disabled = !sel;
  document.getElementById('summary').classList.remove('visible');
  document.getElementById('question-area').style.display = '';
  document.getElementById('question-area').innerHTML = `
    <div class="q-label">${q.label}</div>
    <div class="q-text">${q.text}</div>
    ${q.sub?`<div class="q-sub">${q.sub}</div>`:''}
    <div class="opts ${q.cols===3?'cols3':''}">
      ${q.options.map(opt=>`
        <div class="opt ${sel===opt.id?'selected':''}" onclick="selectOpt('${q.id}','${opt.id}',this)">
          <div class="opt-preview">${opt.preview}</div>
          <div class="opt-label">${opt.label}</div>
          <div class="opt-desc">${opt.desc}</div>
        </div>`).join('')}
    </div>`;
}
function selectOpt(qid,oid,el){
  answers[qid]=oid;
  localStorage.setItem('design-answers-8',JSON.stringify(answers));
  document.querySelectorAll('.opt').forEach(e=>e.classList.remove('selected'));
  el.classList.add('selected');
  document.getElementById('btn-next').disabled=false;
  document.getElementById('nav-info').textContent='';
}
function goNext(){current++;render();window.scrollTo(0,0);}
function goBack(){if(current>0){current--;render();window.scrollTo(0,0);}}
function renderSummary(){
  document.getElementById('question-area').style.display='none';
  const sumEl=document.getElementById('summary');
  sumEl.classList.add('visible');
  let rows='';
  questions.forEach(q=>{
    const aid=answers[q.id];
    const opt=q.options.find(o=>o.id===aid);
    if(!opt)return;
    rows+=`<div class="summary-item"><div class="summary-preview">${opt.preview}</div><div><div class="summary-q">${q.label}</div><div class="summary-a">${opt.label}</div><div style="font-size:.75rem;color:#555;margin-top:.15rem">${opt.desc}</div></div></div>`;
  });
  sumEl.innerHTML=`<div class="done-msg"><h2>✅ Runde 8 abgeschlossen!</h2><p>Diese Details fließen direkt in den React-Build ein.</p></div>${rows}
    <button class="btn btn-primary" style="width:100%;margin-top:1rem;padding:.9rem" onclick="submit()">Absenden →</button>`;
  fetch('/api/design-answers-8',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(answers)})
    .then(r=>r.json()).then(()=>{document.querySelector('.done-msg p').textContent='✅ Gespeichert! Claude baut jetzt die React-UI.';}).catch(()=>{});
}
function submit(){
  fetch('/api/design-answers-8',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(answers)})
    .then(r=>r.json()).then(()=>{document.querySelector('.done-msg p').textContent='✅ Gespeichert!';});
}
render();
</script>
</body>
</html>
